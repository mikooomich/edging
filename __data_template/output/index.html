<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="refresh" content="2">
    <title>Bitmap Viewer</title>
    <style>
        body {
            background-color: #1e1e1e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            gap: 20px;
        }
        img {
            image-rendering: pixelated;
            max-width: 45%;
            max-height: 90%;
            border: 2px solid #ff000000;
        }
    </style>
</head>
<body>
    <div>
        <img src="image_original.png" alt="Original Image">
        <img src="blurred_image.png" alt="Blurred Image">
    </div>
    <div>
        <img src="sobel_vertical.png" alt="test Image">
        <img src="sobel_horizontal.png" alt="test Image">
        <img src="magnitude.png" alt="test Image">
        <img src="direction.png" alt="test Image">
    </div>
</body>
</html>
